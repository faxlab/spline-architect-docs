<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">Baked-first authoring lifecycle</title>
  <desc id="desc">Edit a spline or preset, preview the unbaked result, bake connected output, then an authored change automatically unbakes the affected output.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#19a9dc"/></marker></defs>
  <rect width="1040" height="300" rx="22" fill="#101827"/>
  <g font-family="Segoe UI,Arial" text-anchor="middle">
    <text x="520" y="45" fill="#f4f8fc" font-size="26" font-weight="700">Baked-first editor workflow</text>
    <g fill="#18324e" stroke="#35c3ef" stroke-width="2">
      <rect x="40" y="100" width="200" height="95" rx="14"/><rect x="300" y="100" width="200" height="95" rx="14"/><rect x="560" y="100" width="200" height="95" rx="14"/><rect x="820" y="100" width="180" height="95" rx="14"/>
    </g>
    <g fill="#f4f8fc" font-size="19" font-weight="650"><text x="140" y="137">Author</text><text x="400" y="137">Preview</text><text x="660" y="137">Bake Connected</text><text x="910" y="137">Ship / light</text></g>
    <g fill="#adbed2" font-size="14"><text x="140" y="163">spline • preset • seed</text><text x="400" y="163">editable generated output</text><text x="660" y="163">persistent components</text><text x="910" y="163">static production output</text></g>
    <g stroke="#19a9dc" stroke-width="4" marker-end="url(#a)"><path d="M240 147H286"/><path d="M500 147H546"/><path d="M760 147H806"/></g>
    <path d="M910 205C910 265 140 265 140 209" fill="none" stroke="#f6aa45" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/>
    <text x="525" y="256" fill="#ffd08a" font-size="15">Any authored change automatically unbakes the affected output; review, then rebake explicitly.</text>
  </g>
</svg>
